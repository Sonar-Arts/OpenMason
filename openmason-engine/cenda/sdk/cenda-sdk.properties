# Open Mason Cenda native SDK. The version is the engine version whose libcenda_kernels (packaged in
# openmason-engine-core) was built from these same inputs; a game-owned native library must use the
# SDK of the engine-core version it runs against, or its noise stops being bit-identical.
groupId=${project.groupId}
artifactId=${project.artifactId}
version=${project.version}
